[project]
name = "mdm-demo"
version = "0.1.0"
description = "MDM backend foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.143.0",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pyrefly==1.3.2",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "scripts/**/*.py"]
search-path = ["src"]
