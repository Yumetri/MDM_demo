name: mdm-demo

x-db-environment: &db-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-mdm}
  POSTGRES_USER: ${POSTGRES_USER:-mdm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdm-local-only}

services:
  migrate:
    build:
      context: .
    image: mdm-demo-api
    command: ["make", "migrate"]
    environment: *db-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    image: mdm-demo-api
    init: true
    environment:
      <<: *db-environment
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:-local-development-cursor-key-change-before-sharing}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --locked
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  postgres:
    image: postgres:18.6-bookworm
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mdm}
      POSTGRES_USER: ${POSTGRES_USER:-mdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdm-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  redis:
    image: redis:8.8.3-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    profiles: [test]
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: mdm_test
      POSTGRES_USER: mdm_test
      POSTGRES_PASSWORD: mdm-test-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mdm_test", "-d", "mdm_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    profiles: [test]
    build:
      context: .
    image: mdm-demo-api
    command: ["make", "test"]
    environment:
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mdm_test
      POSTGRES_USER: mdm_test
      POSTGRES_PASSWORD: mdm-test-only
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-data:
